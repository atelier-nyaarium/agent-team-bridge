name: Workflow Call - Build & Release Android APK

on:
  workflow_call:
    inputs:
      create_release:
        description: "Create/refresh the single latest GitHub Release with the APK"
        type: boolean
        required: true

jobs:
  build-android:
    name: ${{ inputs.create_release && 'Build & Release APK' || 'Build APK' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Decode the stable signing keystore so every release shares one signature.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/switchboard.keystore"
            echo "have_keystore=true" >> "$GITHUB_ENV"
          else
            echo "have_keystore=false" >> "$GITHUB_ENV"
          fi

      # A shipped release must be signed: an unsigned assembleRelease emits
      # app-release-unsigned.apk, so the upload + release steps would reference a
      # release/app-release.apk that does not exist and fail with a misleading
      # "file not found". Fail on the real cause instead.
      - name: Require keystore when releasing
        if: ${{ fromJSON(inputs.create_release) && env.have_keystore != 'true' }}
        run: |
          echo "::error::create_release is set but ANDROID_KEYSTORE_BASE64 is unset; assembleRelease would emit an unsigned APK and the release path would not exist."
          exit 1

      # Red unit tests (incl. the golden protocol fixtures shared with vitest)
      # must fail the run before any artifact builds.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.have_keystore == 'true' && format('{0}/switchboard.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Build debug APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: switchboard-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: switchboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Single latest release: delete the fixed-tag release, then recreate it.
      - name: Delete previous release
        if: ${{ fromJSON(inputs.create_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete android-app --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release
        if: ${{ fromJSON(inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: android-app
          name: Switchboard Android (latest)
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          body: |
            Switchboard Android app, built from ${{ github.sha }}.

            **app-release.apk** - production build, signed with the stable release key.
            Updates install over each other. Install this one manually once; after it,
            in-app updates resume. Sideload: `adb install -r app-release.apk`

            **app-debug.apk** - debug build with ingest log streaming to evie.
            Signed with the default debug key (not the release key), so it must be
            installed as a separate app or after uninstalling the release build.
            Sideload: `adb install -r app-debug.apk`
