name: Workflow Call - Build & Release Android APK

on:
  workflow_call:
    inputs:
      create_release:
        description: "Create/refresh the single latest GitHub Release with the APK"
        type: boolean
        required: true

jobs:
  build-android:
    name: ${{ inputs.create_release && 'Build & Release APK' || 'Build APK' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: switchboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Single latest release: delete the fixed-tag release, then recreate it.
      - name: Delete previous release
        if: ${{ fromJSON(inputs.create_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete android-app --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release
        if: ${{ fromJSON(inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: android-app
          name: Switchboard Android (latest)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          body: |
            Switchboard Android app, built from ${{ github.sha }}.

            Sideload to your phone: `adb install -r app-debug.apk`
