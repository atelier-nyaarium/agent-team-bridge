# TS-side gate: lint, tests (incl. the golden protocol fixtures shared with
# the Android unit tests), the codegen drift check (the committed Protocol.kt
# must match what the zod truth generates), and the node_modules residue
# guard. main-push.yml is android-scoped, so without this workflow TS edits
# run zero CI. Post-merge gating (push to main) matches the repo's stance;
# add pull_request if pre-merge gating is ever wanted.
name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  ci:
    name: Lint + Test + Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Module residue guard
        run: bun scripts/check-module-residue.ts

      # Here rather than in the Kotlin workflow: that one runs after merge, where an unused import
      # is reported rather than blocked. kotlinc only ever reports a MISSING import.
      - name: Kotlin import guard
        run: bun scripts/check-kotlin-imports.ts

      - name: Synced-leaf faithfulness
        run: bun scripts/check-sync-hash.ts src/shared/notice.ts

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # vitest runs under node, where `ws` is the real package; the gateway runs under bun, which
      # substitutes its own WebSocket for that import. Certificate pinning is the one thing that
      # difference decides, so it is checked here on bun rather than only in the suite.
      - name: Router pinning works on the shipping runtime
        run: bun run check:pinning

      - name: Codegen drift check
        # --exit-code alone is vacuous for untracked output; the porcelain
        # check also fails if generated files are new or deleted.
        run: |
          bun scripts/codegen-kotlin.ts
          git diff --exit-code -- android/app/src/main/java/com/atelier_nyaarium/switchboard/proto/
          test -z "$(git status --porcelain -- android/app/src/main/java/com/atelier_nyaarium/switchboard/proto/)"

      - name: STTS voice import drift check
        # The bundled catalog's voices must match what the per-provider dumps
        # normalize to, so a stale paste-in cannot ship.
        run: |
          bun scripts/import-stts-voices.ts
          git diff --exit-code -- android/app/src/main/assets/stts-providers.json
