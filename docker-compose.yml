services:
  switch:
    build: .
    hostname: switchboard
    container_name: switchboard
    ports:
      - "20000:20000"
    environment:
      - PORT=20000
      # One arbiter per machine. start-arbiter.sh sets SWITCH_ID to the machine
      # hostname (and --setup writes it to .env); the "switchboard" fallback only
      # applies to a bare `docker compose up` that set no SWITCH_ID anywhere.
      - SWITCH_ID=${SWITCH_ID:-switchboard}
      - RESPONSE_TIMEOUT_MS=600000
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      - FEDERATION_OWNER_SIGN_PUB=${FEDERATION_OWNER_SIGN_PUB:-}
    networks:
      - switchboard-network
    volumes:
      - ./volumes/arbiter:/app/log
      - ${HOME}/projects/evie-bot/kubeconfig.yaml:/app/kubeconfig.yaml:ro
networks:
  switchboard-network:
    name: switchboard
