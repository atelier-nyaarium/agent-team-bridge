services:
  router:
    build: .
    hostname: switchboard
    container_name: switchboard
    ports:
      - "20000:20000"
    environment:
      - PORT=20000
      # One arbiter per machine; set a UNIQUE HOST_ID per machine in .env so two
      # Hosts cannot both fall back to "switchboard" and collide in evie's router.
      - HOST_ID=${HOST_ID:-switchboard}
      - RESPONSE_TIMEOUT_MS=600000
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      - FEDERATION_OWNER_SIGN_PUB=${FEDERATION_OWNER_SIGN_PUB:-}
    networks:
      - switchboard-network
    volumes:
      - ./volumes/arbiter:/app/log
      - ${HOME}/projects/evie-bot/kubeconfig.yaml:/app/kubeconfig.yaml:ro
networks:
  switchboard-network:
    name: switchboard
