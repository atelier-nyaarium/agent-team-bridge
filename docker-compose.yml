services:
  gateway:
    build: .
    container_name: switchboard
    # Restart on crash so an uncaughtException flush-then-exit recovers unattended.
    restart: unless-stopped
    ports:
      # Loopback, not every interface: local HTTP authorizes by session binding, which says nothing
      # about which machine the caller is on. Containers reach it by service name, off this mapping.
      - "127.0.0.1:20000:20000"
      # Arming-only pinned-TLS listener for the phone's LAN bundle delivery (nothing binds it
      # otherwise). The cert's SAN is the LAN IP, so the phone verifies hostname + pins the fingerprint.
      - "20003:20003"
    environment:
      - PORT=20000
      - ENROLL_TLS_PORT=20003
      # One Gateway per machine, named by the device hostname. start-gateway.sh
      # injects the host hostname into GATEWAY_ID; setting it explicitly is an escape
      # hatch for duplicate hostnames. Unset leaves the gateway to fall back to the
      # container's own hostname.
      - GATEWAY_ID=${GATEWAY_ID:-}
      # Shared secret for the reserved "host" WS slot (which drives agent terminals via the
      # console). start-gateway.sh provisions it into .env so a LAN peer cannot squat the slot.
      - HOST_WS_TOKEN=${HOST_WS_TOKEN:-}
      # The operator's admin Domain id, minted at provision and written to .env. Passed through so
      # the gateway resolves the same Domain across a container restart.
      - FEDERATION_DOMAIN_ID=${FEDERATION_DOMAIN_ID:-}
      # Armed only by setup.sh (Enroll gateway) on a creds-less Gateway: a one-time nonce +
      # the host LAN address it advertises in the admit-gateway QR for bundle delivery.
      - ENROLL_NONCE=${ENROLL_NONCE:-}
      - ENROLL_LAN_HOST=${ENROLL_LAN_HOST:-}
    networks:
      - switchboard-network
      - switchboard-federation
    volumes:
      - ./volumes/gateway:/app/log
      # Durable state (federation keys, jobs, mailboxes, replay-guard, session-resume) lives here,
      # separate from the log volume so clearing logs can never wipe federation identity.
      - ./volumes/gateway-data:/app/data
networks:
  switchboard-network:
    name: switchboard
  switchboard-federation:
    name: switchboard-federation
    external: true
